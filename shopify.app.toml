# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Gemist"
client_id = "19d443d2e5f546d9b66197584a1f3ca0"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
automatically_update_urls_on_dev = true

[product.metafields.app.headline]
name = "Storefront headline"
description = "Headline shown in the Gemist theme block"
type = "single_line_text_field"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.app.summary]
name = "Storefront summary"
description = "Supporting copy shown in the Gemist theme block"
type = "multi_line_text_field"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.app.badge]
name = "Storefront badge"
description = "Small label above the headline"
type = "single_line_text_field"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.app.cta_label]
name = "Storefront CTA label"
type = "single_line_text_field"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.app.cta_url]
name = "Storefront CTA URL"
type = "url"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[product.metafields.app.storefront]
name = "Storefront data"
description = "Optional JSON: headline, summary, badge, items[{label,value}], cta_label, cta_url"
type = "json"
access.admin = "merchant_read_write"
access.storefront = "public_read"
